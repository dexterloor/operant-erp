# W0-a tenancy slice — the stack that makes R-28 testable.
#
# PgBouncer runs in pool_mode=transaction with default_pool_size=1 on purpose:
# a pool of one FORCES every client session onto a single shared Postgres backend,
# which is the exact condition ADR-002 §C-3 is about. With a larger pool the
# "leak into the next tenant's request" scenario becomes probabilistic and the
# test suite would be fake-green (R-3).
#
# Run from the repo root:
#   docker compose --env-file .env.infra -f infra/docker-compose.yml up -d
# (`.env.infra` holds every bootstrap password; no PHP entry point reads it.)

services:
  postgres:
    image: postgres:17-alpine
    container_name: erp_postgres
    environment:
      # Bootstrap superuser. Never used by the application or the test suite.
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Roles created by init/10-roles.sh, read from the environment so that no
      # credential is ever written into a committed file (Standing Rule 10).
      DB_OWNER: ${DB_OWNER}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      ERP_APP_USER: ${ERP_APP_USER}
      ERP_APP_PASSWORD: ${ERP_APP_PASSWORD}
      ERP_AI_USER: ${ERP_AI_USER}
      ERP_AI_PASSWORD: ${ERP_AI_PASSWORD}
      ERP_AUTH_USER: ${ERP_AUTH_USER}
      ERP_AUTH_PASSWORD: ${ERP_AUTH_PASSWORD}
      ERP_AUTHLOG_USER: ${ERP_AUTHLOG_USER}
      ERP_AUTHLOG_PASSWORD: ${ERP_AUTHLOG_PASSWORD}
      ERP_RATELIMIT_USER: ${ERP_RATELIMIT_USER}
      ERP_RATELIMIT_PASSWORD: ${ERP_RATELIMIT_PASSWORD}
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - erp_pgdata:/var/lib/postgresql/data
    ports:
      # Direct, unpooled access. Migrations run here as the owner role.
      - "${POSTGRES_DIRECT_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    container_name: erp_pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ERP_APP_USER: ${ERP_APP_USER}
      ERP_APP_PASSWORD: ${ERP_APP_PASSWORD}
      ERP_AI_USER: ${ERP_AI_USER}
      ERP_AI_PASSWORD: ${ERP_AI_PASSWORD}
      ERP_AUTH_USER: ${ERP_AUTH_USER}
      ERP_AUTH_PASSWORD: ${ERP_AUTH_PASSWORD}
      ERP_AUTHLOG_USER: ${ERP_AUTHLOG_USER}
      ERP_AUTHLOG_PASSWORD: ${ERP_AUTHLOG_PASSWORD}
      ERP_RATELIMIT_USER: ${ERP_RATELIMIT_USER}
      ERP_RATELIMIT_PASSWORD: ${ERP_RATELIMIT_PASSWORD}
      # No owner or superuser variable here, and no userlist line for either
      # (ARCHITECTURE.md C-4; V3-12, V4 batch B6, 2026-09-16). This service serves
      # every pooled request; migrations run direct, as the owner, on the postgres
      # port. Asserted statically by ComposeCredentialExposureTest and against the
      # running proxy by PoolConfigurationTest.
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    # The auth file is rendered at start-up from the environment and written to
    # a tmpfs path, so passwords never reach a committed file or the log stream.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        {
          printf '"%s" "%s"\n' "$$ERP_APP_USER" "$$ERP_APP_PASSWORD"
          printf '"%s" "%s"\n' "$$ERP_AI_USER"  "$$ERP_AI_PASSWORD"
          printf '"%s" "%s"\n' "$$ERP_AUTH_USER"      "$$ERP_AUTH_PASSWORD"
          printf '"%s" "%s"\n' "$$ERP_AUTHLOG_USER"   "$$ERP_AUTHLOG_PASSWORD"
          printf '"%s" "%s"\n' "$$ERP_RATELIMIT_USER" "$$ERP_RATELIMIT_PASSWORD"
        } > /run/pgbouncer/userlist.txt
        exec /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini
    tmpfs:
      - /run/pgbouncer:mode=700,uid=70,gid=70
    ports:
      # Pooled access. The application and the isolation suite connect here.
      - "${PGBOUNCER_PORT}:6432"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Mail-C0 (2026-10-23): the mail queue (owner Q-1: Redis, confirmed 2026-10-23; ADR-005 D-4 amended). Password-protected,
  # loopback-bound, LOCAL in `DeployArtefacts::LOCAL_COMPOSE_SERVICES` (ComposeLocalServiceTest). Memory is capped with
  # `noeviction`: when full, a new message is REFUSED loudly (XADD errors) rather than an old one silently evicted -- queued
  # mail is never dropped by Redis itself. `appendonly yes` (fsync every second): queued mail survives a restart, losing at
  # most the last second. Redis 7.4 is RSALv2/SSPLv1 (source-available, internal use permitted; mail-c0-red.md L-4 owner
  # notice) -- 7.2.x or Valkey are the BSD alternatives, same protocol. `make reset` wipes this volume with the database.
  redis:
    image: redis:7.4.11-alpine
    container_name: erp_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.infra}",
              "--maxmemory", "64mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    environment:
      # For the healthcheck only (REDISCLI_AUTH keeps it off the redis-cli command line).
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.infra}
    volumes:
      - erp_redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:?set REDIS_PORT in .env.infra}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Mail-C0 (2026-10-23): a local mail catcher. Every email the worker sends in development lands here -- including,
  # from Mail-C1, password-reset links -- and nowhere else. LOCAL ONLY: both ports are bound to the loopback, it holds
  # no application credential, and it is in `DeployArtefacts::LOCAL_COMPOSE_SERVICES` (ComposeLocalServiceTest holds it
  # to all three). Ports fail loudly when `.env.infra` lacks them (`:?`), rather than publishing on a random one.
  mailpit:
    image: axllent/mailpit:v1.32.0
    container_name: erp_mailpit
    environment:
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:?set MAILPIT_SMTP_PORT in .env.infra}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:?set MAILPIT_UI_PORT in .env.infra}:8025"

volumes:
  erp_pgdata:
  erp_redisdata:
