;; W0-a tenancy slice — PgBouncer configured to reproduce Neon's pooled endpoint.
;;
;; Neon fronts every database with PgBouncer in pool_mode=transaction. ADR-002 §C-3
;; is entirely a consequence of that mode. This file reproduces it locally so the
;; R-28 spike does not have to wait on gate G-3 (a Neon account).

[databases]
;; No user= / password= here: the client's own credentials are used, so the
;; connection reaching Postgres is genuinely erp_app, not a proxy identity.
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = plain
auth_file = /run/pgbouncer/userlist.txt

;; --- the settings the R-28 spike actually depends on -------------------------
pool_mode = transaction

;; A pool of exactly one backend. Deliberate: it removes the chance that two
;; tenants happen to land on different backends and the leak test passes for
;; the wrong reason.
default_pool_size = 1
min_pool_size = 1
reserve_pool_size = 0
;; Per (database, user) pool size is what guarantees the shared backend the
;; R-28 leak test depends on, and that is default_pool_size / max_user_connections
;; above. max_db_connections is a whole-database ceiling across every pool, so at
;; 1 it also serialised erp_app against erp_ai and would deadlock the moment a
;; test held two principals open at once. The R-28 guarantee is untouched by it,
;; because it never rested on this setting.
;;
;; The number is not free-floating. Every pooled identity -- the five application
;; roles, and nothing else -- is capped at one server connection by
;; max_user_connections, so this ceiling has to be at least that count or a role
;; **silently queues** instead of visibly failing, which is the worst of both.
;; At 8 with six identities it had already stopped being headroom and become a
;; near miss.
;;
;; Corrected 2026-09-16 (V3-6, V3-12; V4 batch B6). This comment said the owner
;; was a pooled identity and that "the seventh principal fails a test". The owner
;; no longer has a userlist entry (C-4: this service serves every pooled request),
;; and the `>=` against 16 never failed below sixteen identities. What fails now:
;; PoolConfigurationTest compares the running proxy's SHOW USERS with
;; DatabaseRoles::APPLICATION_ROLES (an extra identity is red) and pins that list
;; at five (a sixth application role needs the user, ARCHITECTURE.md §3.3 PR-5).
max_db_connections = 16
max_user_connections = 1

;; PgBouncer only issues server_reset_query in session pooling unless
;; server_reset_query_always is on. Stated explicitly rather than left to the
;; default, because whether DISCARD ALL runs between transactions is exactly
;; what decides if a bare SET leaks. This is the upstream default; we are not
;; weakening anything to manufacture the failure.
server_reset_query = DISCARD ALL
server_reset_query_always = 0
;; ----------------------------------------------------------------------------

max_client_conn = 200
ignore_startup_parameters = extra_float_digits,options,search_path,application_name

log_connections = 0
log_disconnections = 0

;; The container runs as a non-root user; keep runtime state on the tmpfs.
unix_socket_dir =
pidfile = /run/pgbouncer/pgbouncer.pid

;; Lets the test suite and an operator inspect pool state (SHOW CONFIG / SHOW USERS /
;; SHOW POOLS / SHOW SERVERS). Read-only: stats_users may run SHOW and nothing else.
;;
;; admin_users is empty on purpose (V3-7; V4 batch B6, 2026-09-16). It was erp_app,
;; which handed the principal of every authenticated request PgBouncer's admin
;; console: PAUSE, KILL, SUSPEND, SHUTDOWN, RELOAD, SET. PoolConfigurationTest
;; asserts both settings on the running proxy and that an admin command from
;; erp_app is refused. An operator who needs the console locally uses a separate,
;; non-application identity added for that session, never an application role.
;;
;; Noted, not changed: auth_type = plain above means clients send cleartext
;; passwords to PgBouncer. Local only (the published port is this machine's);
;; scram-sha-256 with the userlist is the candidate if this file ever leaves
;; the laptop.
admin_users =
stats_users = erp_app
