  # last edit, per the instruction below.
  # With the whole `sales_order_line` write slice in the tree, before this, it was
  # **0 violations / 256 skipped / 1317 allowed** — re-derived AFTER the last
  # commit's tests landed. ⚠ It read **1315** for the length of one commit, measured before those
  # tests existed: the same shape this header has now recorded three times, which is why the
  # instruction below is to re-run the commands and never trust this line. At `UpdateSalesOrderLine`
  # earlier the same day it was 92 / 65 / 6 and **0 / 253 / 1300**, at `CreateSalesOrderLine`
  # 91 / 64 / 6 and **0 / 246 / 1288**, and at `UpdateSalesOrder` 89 / 62 / 6 and **0 / 240 / 1260**.
  # ⚠ `DeleteSalesOrderLine` and `RestoreSalesOrderLine` added NO edge line: their processors take
  # `SalesOrderWriter` and return `null` or an already-registered read model, so the register did not
  # move for either -- read off the run rather than assumed from the pattern.
  # `make deptrac` reports **0 violations / 240 skipped / 1260 allowed** (re-derived AFTER
  # `SalesOrder::shipTo()` was deleted -- it read 1261 while that method still used `Country`, and
  # restating the earlier figure would have published a number no run produces); with
  # `ListSalesOrders` earlier the same day it was 87 / 60 / 6 and **0 / 232 /
  # 1248**, and at `ListSalesOrderLines` before that 85 / 58 / 6 and **0 / 222 /
  # 1226**. The skipped figure counts **occurrences**, one per site, so it is not
  # this file's line count and the two must not be reconciled.)
  #
  # ⚠ **CORRECTED BY `LEAD` 2026-09-19, AND THIS IS THE THIRD GENERATION OF THE
  # SAME DEFECT IN THIS HEADER.** The block above replaced a chain whose totals
  # were overstated by ten — correctly diagnosed — and then published **76 / 52 / 5**,
