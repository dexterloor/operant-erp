  # printed once, for this commit only, with the command that produces them:
  #
  #   grep -c -- "- App" deptrac.yaml                    ->  92 edge lines
  #   grep -- "- App" deptrac.yaml | grep -c "A-7"       ->  65 A-7
  #   grep -- "- App" deptrac.yaml | grep -c "A-5"       ->   6 A-5
  #
  # (Re-derived 2026-09-21 with `DeleteSalesOrder` in the tree (sales slice 5): the three commands still
  # return **92 / 65 / 6 — no edge line was added**, and `make deptrac` reports **0 violations / 258 skipped /
  # 1321 allowed**. The +2 skipped are OCCURRENCES of an already-registered pair, not new pairs:
  # `SalesOrderWriter::archive()` reads `SalesOrder::STATUS_CONFIRMED` and `STATUS_PARTIALLY_FULFILLED` off the
  # entity to choose its refusal's advice (`SalesOrderWriter -> Entity\SalesOrder`, registered with
