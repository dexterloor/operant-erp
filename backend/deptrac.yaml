  # signal that an entry here no longer matches anything and has gone stale.
  #
  # Each line carries the rule it deviates from:
  #
  #   A-1  (1 edge)   Platform depends on a module: `PermissionGate` →
  #                   `DenialAuditWriter`, which is also A-5 and is counted in
