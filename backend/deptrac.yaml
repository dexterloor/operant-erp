  layers:
    # A-10 — the one Doctrine class the rule singles out. Held in a layer of
    # its own and excluded from `Doctrine` below, because deptrac puts a class
    # in every layer that collects it: if both matched, allowing this one from
    # `PlatformTenancy` would still trip the broader rule and the A-10
    # exception could never be expressed.
    - name: DoctrineDbalConnection
      collectors:
        - type: classNameRegex
          value: '#^Doctrine\\DBAL\\Connection$#'
    # A-8 — `Domain.allowed` omits this layer, which is the whole rule.
    - name: Doctrine
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^Doctrine\\#'
          must_not:
            - type: classNameRegex
              value: '#^Doctrine\\DBAL\\Connection$#'
    # A-11 — allowed from `<M>ApiResource` and `Platform\Http`, nowhere else.
    - name: HttpFoundation
      collectors:
        - type: classNameRegex
          value: '#^Symfony\\Component\\HttpFoundation\\#'
    # A-9 — specified, and NOT yet executable: this class does not exist. The
    # layer is empty today and the rule below it is therefore vacuous today.
    # It is written now so that creating the class turns the rule on rather
    # than requiring somebody to remember to write it.
    - name: PlatformAppConnection
      collectors:
        - type: classNameRegex
          value: '#^App\\Platform\\Tenancy\\Connection\\AppConnection$#'

    # ---- L0 · Platform, by component (§4's Owns column) ----------------
    - name: PlatformConsole
      collectors:
        - type: classNameRegex
          value: '#^App\\Platform\\Console\\#'
    - name: PlatformDomain
      collectors:
        - type: classNameRegex
          value: '#^App\\Platform\\Domain\\#'
    - name: PlatformHttp
      collectors:
        - type: classNameRegex
          value: '#^App\\Platform\\Http\\#'
    - name: PlatformPersistence
      collectors:
        - type: classNameRegex
          value: '#^App\\Platform\\Persistence\\#'
    - name: PlatformSecurity
      collectors:
        - type: classNameRegex
          value: '#^App\\Platform\\Security\\#'
    - name: PlatformTenancy
      collectors:
        - type: classNameRegex
          value: '#^App\\Platform\\Tenancy\\#'
    # V3-1(i), V4 batch B2b-2 (2026-09-16): the front-controller credential guard. It runs in
    # `public/index.php` and `bin/console` before any kernel exists, so it may depend only on
    # DBAL's DSN parser and driver list (`Doctrine`) and on `DatabaseRoles` (`PlatformTenancy`),
    # and nothing may depend on it -- no layer's `allowed` list names it.
    - name: PlatformRuntime
      collectors:
        - type: classNameRegex
          value: '#^App\\Platform\\Runtime\\#'
    # Symfony's own kernel. Not a module and not a Platform component; it
    # exists as a layer so that it is covered rather than silently uncollected.
    - name: AppKernel
      collectors:
        - type: classNameRegex
          value: '#^App\\Kernel$#'

    # ---- L1 · SharedKernel --------------------------------------------
    - name: SharedKernel
      collectors:
        - type: classNameRegex
          value: '#^App\\SharedKernel\\#'

