  # **Re-derive the three counts with the commands above rather than adding five
  # to the last ones you read** — this header has now published a wrong total in
  # three successive generations, and the standing lesson is that a count written
  # by hand goes stale between the measuring and the committing.
  #
  # `CancelSalesOrder` added **four**: three A-7 of the shapes already named, and
  # **the first A-5 line the Sales module has ever had** — `SalesOrderCancellation`
  # calling `SalesOrderAuditWriter`, which is `PurchaseOrderCancellation`'s edge
