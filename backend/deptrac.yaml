# ARCHITECTURE.md §5, executed.
#
# Every rule below is A-1…A-15 as that section writes them. Nothing here is a
# preference and nothing here is a rule this file invented: where §5.3's
# "Expressed in deptrac as" column names a mechanism, that mechanism is what is
# written; where a rule is marked "not expressible in deptrac" (A-12, A-13,
# A-14) it is absent here and named in the header comment of the section that
# does carry it.
#
# Deptrac is default-deny: an edge between two layers that no `allowed` list
# names is a violation. So the file's negative content — which layers do NOT
# appear in which lists — is the larger half of the ruleset, and A-1, A-4, A-5
# and A-8 are enforced entirely by omission. Each is commented where it bites.
#
# The four rules that are NOT here, so that this file is not read as the whole
# of §5:
#   A-12  cross-module Doctrine associations. Not static-analysable as a rule
#         about `targetEntity`; §5.3 records it as a known deviation owned by
#         BE-LEAD. It IS visible here — see the `skip_violations` register.
#   A-13  cross-module writes go through a command interface. Follows from A-2
#         plus A-10; the runtime half is the §5.5 command-bus guard.
#   A-14  cross-module command depth is 1. Runtime, not static.
#   A-15  no `allowed` entry may use a wildcard collector. It is a lint over
#         THIS file, so it cannot be enforced by this file. It is
#         `DeptracRulesetTest::noAllowedEntryUsesAWildcardOrNamesAnUndeclaredLayer`.
#
# `Ai` and `Analytics` have layers and rules here and no classes on disk. That
# is deliberate: §4.0 settled their namespaces as `Modules\Ai` and
# `Modules\Analytics` (SEC-O-12) and recorded that no check executed against
# that ruling. These layers are the first that will.

deptrac:
  paths:
    - ./src

  # ------------------------------------------------------------------------
  # The deviation register.
  #
