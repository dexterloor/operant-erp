  #                   and symfony/messenger is not installed, so the audit path
  #                   is a direct synchronous call by necessity. One of them
  #                   is also A-1 (`PermissionGate` is Platform).
  #   A-7  (47 edges) A module's `Application` layer depends "up" — on its own
  #                   `ApiResource` (read models: `ItemResource`, `ItemCollection`,
  #                   `CurrentUserResource` are declared there and returned from
