  # **Recount rather than restate this line, with the commands above** —
  # `make deptrac`'s own skipped figure is the authority and it counts occurrences,
  # one per site rather than one per pair. Not one of them is a new *shape* —
  # every one is the Output 4 slice shape already recorded for
