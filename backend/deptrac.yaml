  ruleset:
    # A-1 — no Platform or SharedKernel entry names a `Modules*` layer, on any
    # line below. That is the rule; there is nothing else to write for it.
    PlatformConsole:
      - Doctrine
      - HttpFoundation
      - PlatformDomain
      - PlatformHttp
      - PlatformPersistence
      - PlatformSecurity
      - PlatformTenancy
    PlatformDomain:
      - Doctrine
      - HttpFoundation
      - PlatformConsole
      - PlatformHttp
      - PlatformPersistence
      - PlatformSecurity
      - PlatformTenancy
    PlatformHttp:
