  # ZERO violations only because the class-to-class edges below are skipped, and
  # every one of them is an edge that exists in the tree TODAY. Output 5 is
  # a relocation and a ruleset; its brief forbade it from changing behaviour, so
  # each edge is recorded here rather than repaired. Five of the six groups were
  # discovered by running this ruleset for the first time and are reported as
  # findings; the sixth (A-12) was already recorded in ARCHITECTURE.md §5.3 as a
  # known deviation with `BE-LEAD` as owner.
