  # synchronous audit call because `symfony/messenger` is not installed (A-5).
  # Recorded here rather than repaired for the reason the whole register exists:
  # repairing them is a design change to the slice shape Output 4 shipped, and
  # it is the same design change for all of them.
  #
  # `skip_violations` is exact: it skips the named class-to-class pair and
  # nothing else. A NEW edge of any of these shapes is a violation and fails the
  # build. That is the property that makes this a register rather than a
  # suppression, and `DeptracRulesetTest` asserts both halves — zero
