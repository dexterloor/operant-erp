  # The figures were measured before the commit's last edits landed (the A-5 line
  # and two A-7 lines arrived after), so the fix for a stale measurement was itself
  # stale. **The lesson is not "count more carefully" — it is that a count written
  # by hand goes stale between the measuring and the committing.** Re-run the three
