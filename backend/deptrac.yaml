      - HttpFoundation
      - PlatformConsole
      - PlatformDomain
      - PlatformPersistence
      - PlatformSecurity
      - PlatformTenancy
    PlatformPersistence:
      - Doctrine
      - HttpFoundation
      - PlatformConsole
      - PlatformDomain
      - PlatformHttp
      - PlatformSecurity
      - PlatformTenancy
    PlatformSecurity:
      - Doctrine
      - HttpFoundation
      - PlatformConsole
      - PlatformDomain
      - PlatformHttp
      - PlatformPersistence
      - PlatformTenancy
    PlatformTenancy:
      - Doctrine
      - DoctrineDbalConnection
      # A-9's forbidden token, named here so that its ABSENCE from every `Ai`
      # entry is a statement rather than an oversight. The class does not exist
      # yet, so this layer is empty and A-9 is vacuous today -- said out loud in
      # the header rather than left for a reader to discover.
      - PlatformAppConnection
      - HttpFoundation
      - PlatformConsole
      - PlatformDomain
      - PlatformHttp
      - PlatformPersistence
      - PlatformSecurity
    PlatformRuntime:
      - Doctrine
      - PlatformTenancy
    AppKernel: ~
