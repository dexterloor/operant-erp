  # 4, not 3 — the header had not been kept up), API-O-26's token split
  # removed the one A-1 edge `AuthenticationGate` carried, and on 2026-09-15
  # `PurchaseOrderLineRow` stopped using `NamedReference` (API-23b clause (ii)
  # moved item references to `Application\ItemReference`) — measured 2026-09-15 as
  # 74 edge lines, 41 of them A-7. Re-counted 2026-09-19 after the sales slice's
  # first writer: 78 edge lines, 45 of them A-7. Re-counted again the same day
  # after `GetSalesOrder`: 80 edge lines, 47 of them A-7 — two new lines, both
  # A-7, both the same Output 4 slice shape (`SalesOrderReader` returning its own
  # module's `ApiResource` read model, and `SalesOrderRow` building the new
  # `SalesActorReference` expansion). **Re-counted a third time the same day after
  # `ConfirmSalesOrder`: 49 A-7** — two more, both A-7 and
  # both `PurchaseOrderApproval`'s shape exactly (`SalesOrderConfirmation` returning
  # its own module's `ApiResource` read model, and reading the entity whose status
  # guard it invokes). **No A-5 line joined them, and that absence was the ruling
  # rather than an oversight:** that operation writes no audit event, because there
  # is no `sales_order.confirmed` in the catalogue and `B-4a` owns that deferral.
  #
  # ⚠ **EVERY "edge lines" TOTAL IN THE CHAIN ABOVE WAS WRONG, and the A-7
  # sub-counts were all right.** Measured at `e81cb35`, where this header claimed
  # **82**: `git show HEAD:backend/deptrac.yaml | grep -c -- "- App"` returns
  # **72**, while the same file's A-7 count returns **49**, matching. The running
  # total had been incremented correctly on top of a base that was already
  # overstated by ten — the 2026-09-14 note above records the base being disputed
  # ("it held 76 against this header's 71") and the total never being re-derived
