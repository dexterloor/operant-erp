# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # API-2 / P-1. Declared once, here, because two things need it and neither
    # may carry its own copy: the route prefix in config/routes/api_platform.yaml
    # and the scope of the problem+json translator. `ApiRoutingTest` asserts the
    # router agrees with this value rather than trusting that it was kept in step.
    app.api_base_path: '/api/v1'

    # `app.inventory.default_currency_code` WAS DECLARED HERE AND IS GONE
    # (2026-09-10, ledger E4-3). It was an instance-wide container parameter
    # supplying a per-tenant business value: every tenant on the deployment
    # priced in euros by construction, above the isolation boundary where no
    # RLS, tenant-context or schema check could reach it. The value now lives in
    # `tenant_settings.default_currency_code`, one row per workspace, read by
    # `ItemWriter` inside the tenant transaction. Recorded rather than deleted
    # silently, so that "add a default currency parameter" reads as a decision
    # already taken and reversed.

    # `API.md` §7.1 step 5 — the fixed dummy the KDF runs against on either miss
    # path, and the ONE place the KDF's parameters are configured:
    # `PasswordVerifier` reads `memory_cost`, `time_cost` and `threads` out of
    # this string rather than taking three more parameters, because "a dummy of
    # the same cost factor" is a requirement about two values and two configured
    # numbers drift.
    #
    # **Argon2id since 2026-09-10, with no bcrypt fallback** (user-approved). The
    # hazard the switch closes is a mixed store: a bcrypt-hashed user beside an
    # Argon2id dummy makes the miss paths measurably cheaper than the
    # wrong-password path and rebuilds the user-existence oracle E-7 removes.
    # `app_user` held zero rows, so there was nothing to migrate and no window to
    # arrange. `PasswordVerifier` refuses any dummy that is not Argon2id.
    #
    # m=65536 KiB, t=4, p=1 — `NativePasswordHasher`'s own defaults and PHP's.
    # Measured on this machine: 223 ms per verify, against 356 ms for the bcrypt
    # cost 12 this replaced.
    #
    # An Argon2id hash of 32 random bytes nobody recorded. Not a secret — it
    # matches no password by construction — so it is here rather than in the
    # environment; hiding a non-secret makes the real ones harder to find
    # (Standing Rule 10).
    app.auth.dummy_password_hash: '$argon2id$v=19$m=65536,t=4,p=1$S1F6OVZrRTBnS2lkd3ZhMg$m0ZB1phEShmbpBMRp34kto63MuUEw8yUM3BmLe07MT0'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        # Data, not services. An `#[ErrorResource]` exception and a set of
        # request/response DTOs are constructed by the serializer and by named
        # factories; registering them as services would have the container try to
        # autowire constructors that take a SKU.
        # Data, not services. These are constructed by the serializer or by
        # named factories, and registering them would have the container try to
        # autowire a constructor that takes a SKU.
        #
        # `ItemResource`, `ItemCollection` and `ApiProblem` are deliberately NOT
        # excluded: API Platform discovers resources through the container's
        # attribute autoconfiguration, so a resource class the container never
        # sees has no routes at all. It marks them abstract, so nothing tries to
        # instantiate them.
        exclude:
            - '../src/Platform/Http/Pagination/'
            - '../src/Platform/Http/Problem/ProblemType.php'
            # The resolved caller. Data, not a service: it is built per request
            # by `IdentityReader` and held by `RequestIdentity`, and registering
            # it would have the container try to autowire a constructor that
            # takes a tenant id.
            - '../src/Platform/Security/Identity.php'
            - '../src/Modules/Inventory/ApiResource/{CreateItemInput.php,UpdateItemInput.php,SupplierReference.php}'
            - '../src/Modules/Inventory/Application/{ItemRow.php,ItemListCriteria.php}'
            # Stock reads C1 (2026-10-14): the stock row's read model and its three references — data, not services.
            - '../src/Modules/Inventory/Application/{StockLevelView.php,StockItemRef.php,StockLocationRef.php,StockWarehouseRef.php}'
            # Stock reads C2: the movement read model, its page and its criteria.
            - '../src/Modules/Inventory/Application/{StockMovementView.php,StockMovementPage.php,StockMovementListCriteria.php}'
            # Stock count C1: the count's request body — data, not a service.
            - '../src/Modules/Inventory/ApiResource/CreateStockAdjustmentInput.php'
            # Stock transfer C1: the transfer's request body — data, not a service.
            - '../src/Modules/Inventory/ApiResource/CreateStockTransferInput.php'
            # Audit reads C1 (2026-10-21): the trail's read model, its page and its criteria, and the actor reference —
            # data, not services. `AuditLogEntryCollection` is NOT excluded, for `ItemResource`'s reason.
            - '../src/Modules/AuditLog/Application/{AuditLogEntryView.php,AuditLogPage.php,AuditLogListCriteria.php}'
            - '../src/Modules/AuditLog/ApiResource/AuditActorReference.php'
            # Audit reads C2 (2026-10-21): the History's read model, page and criteria, the subject map and the shared paging
            # parameters (both function-only, private constructors) — data, not services. `AuditRecordCollection` is NOT
            # excluded, for `ItemResource`'s reason.
            - '../src/Modules/AuditLog/Application/{AuditRecordView.php,AuditRecordPage.php,AuditRecordCriteria.php,RecordHistorySubjects.php}'
            - '../src/Modules/AuditLog/ApiResource/State/AuditListParameters.php'
            # Data, not services, on the Output 4 §7 side: request/response DTOs
            # and read models the serializer or a named factory builds, plus one
            # function-only class with a private constructor the container would
            # otherwise try to instantiate.
            #
            # `TokenResource` and `CurrentUserResource` are deliberately NOT
            # excluded, for the reason `ItemResource` is not: API Platform
            # discovers resources through the container's attribute
            # autoconfiguration, so a resource class the container never sees has
            # no routes at all.
            - '../src/Modules/UserManagement/Domain/PreAuthKeys.php'
            - '../src/Modules/UserManagement/ApiResource/{IssueTokenInput.php,ChangePasswordInput.php,RoleReference.php}'
            - '../src/Modules/UserManagement/Application/{SignInCommand.php,SignInResult.php,ChangePasswordCommand.php,ChangePasswordResult.php,ChangePasswordOutcome.php}'
            - '../src/Modules/UserManagement/Infrastructure/{CredentialRow.php,IssuedToken.php}'
            # The Purchasing slice's data classes. Same rule as the two blocks
            # above: request/response DTOs and read models the serializer or a
            # named factory builds, plus two function-only classes the container
            # would otherwise try to instantiate.
            #
            # `PurchaseOrderResource`, `PurchaseOrderCollection`,
            # `PurchaseOrderLineResource` and `PurchaseOrderLineCollection` are
            # deliberately NOT excluded, for the reason `ItemResource` is not:
            # API Platform discovers resources through the container's attribute
            # autoconfiguration, so a resource class the container never sees has
            # no routes at all.
            - '../src/Modules/Purchasing/ApiResource/{NamedReference.php,ActorReference.php,CreatePurchaseOrderInput.php,UpdatePurchaseOrderInput.php,ApprovePurchaseOrderInput.php,CancelPurchaseOrderInput.php,CreatePurchaseOrderLineInput.php,UpdatePurchaseOrderLineInput.php}'
            - '../src/Modules/Purchasing/ApiResource/State/QueryParameters.php'
            - '../src/Modules/Purchasing/Application/{PurchaseOrderRow.php,PurchaseOrderLineRow.php,PurchaseOrderListCriteria.php,PurchaseOrderViews.php}'
            # The Sales slice's data classes (Output 9, sales slice 1, commit 2).
            # Same rule as the three blocks above: a request DTO the serializer
            # builds, a reference DTO, and one function-only read model.
            #
            # `SalesOrderResource` is deliberately NOT excluded, for the reason
            # `ItemResource` is not: API Platform discovers resources through the
            # container's attribute autoconfiguration, so a resource class the
            # container never sees has no routes at all.
            - '../src/Modules/Sales/ApiResource/{SalesNamedReference.php,CreateSalesOrderInput.php}'
            - '../src/Modules/Sales/Application/SalesOrderRow.php'
            # Customers slice 1 C1 (2026-10-09): the read models and parsed criteria `CustomerReader` builds — data, not
            # services. `CustomerResource` and `CustomerCollection` are NOT excluded, for `ItemResource`'s reason.
            - '../src/Modules/Customers/Application/{CustomerView.php,CustomerPage.php,CustomerListCriteria.php}'
            # Customers slice 1 C2 (2026-10-09): the two request bodies (the serializer builds them) and `PaymentTerms`, a
            # constants-only class with a private constructor the container would otherwise try to instantiate.
            - '../src/Modules/Customers/ApiResource/{CreateCustomerInput.php,UpdateCustomerInput.php}'
            - '../src/Modules/Customers/Application/Contract/PaymentTerms.php'
            # Customers slice 1 C3 (2026-10-09): the address read model and the two address request bodies — data, not services.
            - '../src/Modules/Customers/Application/CustomerAddressView.php'
            - '../src/Modules/Customers/ApiResource/{CreateCustomerAddressInput.php,UpdateCustomerAddressInput.php}'
            # Customers slice 2 C1 (2026-10-19): the contact read model and the two contact request bodies — data, not services.
            - '../src/Modules/Customers/Application/CustomerContactView.php'
            - '../src/Modules/Customers/ApiResource/{CreateCustomerContactInput.php,UpdateCustomerContactInput.php}'
            # Suppliers slice 1 C1 (2026-10-12): the read models and parsed criteria `SupplierReader` builds — data, not
            # services (customers C1's line, for the same reason).
            - '../src/Modules/Suppliers/Application/{SupplierView.php,SupplierPage.php,SupplierListCriteria.php}'
            # Suppliers slice 1 C2 (2026-10-12): the two request bodies (the serializer builds them) and `SupplierPaymentTerms`,
            # a constants-only class with a private constructor the container would otherwise try to instantiate.
            - '../src/Modules/Suppliers/ApiResource/{CreateSupplierInput.php,UpdateSupplierInput.php}'
            - '../src/Modules/Suppliers/Application/Contract/SupplierPaymentTerms.php'
            # Suppliers slice 1 C3 (2026-10-12): the catalogue read model, the item reference and the two catalogue request
            # bodies — data, not services.
            - '../src/Modules/Suppliers/Application/SupplierProductView.php'
            - '../src/Modules/Suppliers/ApiResource/{SupplierItemReference.php,CreateSupplierProductInput.php,UpdateSupplierProductInput.php}'
            # Warehouses slice 1 C1 (2026-10-13): the two read models — data, not services. (C1 also excluded the location
            # item DTO, `StorageLocationResource`; C3 made it an `ApiResource` with its writes, so it is no longer excluded,
            # for `ItemResource`'s reason.)
            - '../src/Modules/Warehouses/Application/{WarehouseView.php,StorageLocationView.php}'
            # Warehouses slice 1 C2 (2026-10-13): the two request bodies (the serializer builds them).
            - '../src/Modules/Warehouses/ApiResource/{CreateWarehouseInput.php,UpdateWarehouseInput.php}'
            # Warehouses slice 1 C3 (2026-10-13): the two location request bodies, and `LocationKinds`, a constants-only class
            # with a private constructor the container would otherwise try to instantiate.
            - '../src/Modules/Warehouses/ApiResource/{CreateStorageLocationInput.php,UpdateStorageLocationInput.php}'
            - '../src/Modules/Warehouses/Application/Contract/LocationKinds.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # T-1 / ADR-005 D-5 — the tenant is the signed claim, resolved by
    # `AuthenticationGate` before the controller runs. Deliberately an explicit
    # binding rather than an autowired default: an interface with one
    # implementation resolves silently, and the day a second one appears the
    # choice should be an edit somebody makes on purpose. It still fails closed:
    # with no identity resolved, `RequestIdentity::authenticated()` throws.
    App\Platform\Tenancy\CurrentTenant: '@App\Platform\Tenancy\AuthenticatedTenant'

    # E-1's collaborators are on `erp_app`, and the binding is explicit for the
    # reason the §7 block below gives: an autowired `Connection` with no binding
    # resolves to the DBAL default connection, which is `owner` -- the schema
    # owner, not `erp_app` (measured, `ConnectionBindingTest`; the entity
    # manager's pin to `app` does not govern autowiring). Until 2026-09-14 this
    # comment said it would resolve to `erp_app`; it never did. Both of these
    # are correct on `erp_app` and on nothing
    # else -- `IdentityReader` reads `app_user`/`user_role`/`role_permission`
    # under RLS, and `DenialAuditWriter` needs the `SELECT, INSERT` on
    # `audit_log` that only `erp_app` holds (S-9, `API.md` §9.2).
    App\Platform\Security\IdentityReader:
        arguments:
            $app: '@doctrine.dbal.app_connection'

    App\Modules\AuditLog\Infrastructure\DenialAuditWriter:
        arguments:
            $app: '@doctrine.dbal.app_connection'

    # E-23's writer and E-23's throttle, both on `erp_app` and both explicit for
    # the same reason as the two above: without the binding an autowired
    # `Connection` would be the schema owner, not `erp_app`. `erp_app` is the
    # principal E-23 names -- it already holds
    # `SELECT, INSERT` on `audit_log` and needs no new grant -- and the
    # pre-authentication principals are deliberately not reachable from an
    # authenticated path.
    App\Modules\AuditLog\Infrastructure\PasswordChangeAuditWriter:
        arguments:
            $app: '@doctrine.dbal.app_connection'

    App\Modules\UserManagement\Application\PasswordChangeThrottle:
        arguments:
            $app: '@doctrine.dbal.app_connection'

    # ------------------------------------------------------------------
    # Output 4 §7 — the token sign-in path.
    #
    # Every one of these is an EXPLICIT connection binding, and that is the
    # security control rather than a configuration style. `API.md` §7.1 names one
    # principal per step. **Delete a binding and the container still compiles:
    # the class is autowired to the DBAL default connection, `owner` -- the
    # schema owner -- not to `erp_app`** (measured 2026-09-14,
    # `ConnectionBindingTest::anUnboundAutowiredConnectionIsTheSchemaOwner`).
    # This comment used to say an unbound `Connection` would silently be
    # `erp_app`; it never was. No grant makes that case loud, because the owner
    # holds every privilege; whether the class then misbehaves depends on what
    # it does. The missing binding itself is what `ConnectionBindingTest`
    # catches. What the grants DO make loud is narrower: a binding pointed
    # explicitly at `app` fails on its first statement, because `erp_app` holds
    # nothing on the three counter tables
    # (`GrantFootprintTest::aRateLimiterWiredToTheWrongConnectionFailsImmediately`).
    # ------------------------------------------------------------------
    App\Modules\UserManagement\Infrastructure\PreAuthBudgets:
        arguments:
            $rateLimit: '@doctrine.dbal.ratelimit_connection'

    App\Modules\UserManagement\Infrastructure\LockoutStore:
        arguments:
            $rateLimit: '@doctrine.dbal.ratelimit_connection'

    App\Modules\UserManagement\Infrastructure\CredentialLookup:
        arguments:
            $auth: '@doctrine.dbal.auth_connection'

    App\Modules\UserManagement\Infrastructure\AuthTrailWriter:
        arguments:
            $authLog: '@doctrine.dbal.authlog_connection'

    # The one collaborator that IS on `erp_app`, and only because `/me` runs
    # after authentication. §7.1 step 9 and this reader are the whole of it.
    App\Modules\UserManagement\Application\CurrentUserReader:
        arguments:
            $app: '@doctrine.dbal.app_connection'

    App\Modules\UserManagement\Infrastructure\EmailHasher:
        arguments:
            $key: '%env(AUTH_EMAIL_HASH_KEY)%'

    # API-O-26 — minting and verifying are two classes, and they are bound to
    # ONE secret, by name, twice (Standing Rule 10). The issuer stays in
    # UserManagement and the verifier is Platform's; the algorithm is not a
    # binding at all, because the issuer reads `AccessTokenVerifier::ALGORITHM`.
    # `AccessTokenSplitTest` goes red if these two ever name different keys.
    App\Modules\UserManagement\Infrastructure\AccessTokenIssuer:
        arguments:
            $signingKey: '%env(AUTH_TOKEN_SIGNING_KEY)%'

    App\Platform\Security\AccessTokenVerifier:
        arguments:
            $signingKey: '%env(AUTH_TOKEN_SIGNING_KEY)%'

    # The KDF itself, as a service, so the test environment can decorate it and
    # count invocations **at the KDF boundary**. It is built by a named factory
    # rather than with inline arguments because its three parameters are read off
    # the dummy, and that derivation has to exist in exactly one place —
    # `PasswordVerifier::kdfFor()`. Wiring it to a hasher that disagrees with the
    # dummy is not a silent degradation: `PasswordVerifier::__construct()` asks
    # the component itself (`needsRehash($dummy)`) and throws.
    app.auth.kdf:
        class: Symfony\Component\PasswordHasher\Hasher\NativePasswordHasher
        factory: ['App\Modules\UserManagement\Infrastructure\PasswordVerifier', 'kdfFor']
        arguments: ['%app.auth.dummy_password_hash%']

    App\Modules\UserManagement\Infrastructure\PasswordVerifier:
        arguments:
            $dummyHash: '%app.auth.dummy_password_hash%'
            $kdf: '@app.auth.kdf'

    # Explicit, like the `CurrentTenant` binding above and for the same reason:
    # an interface with one implementation resolves silently, and this one exists
    # so a test decorator can count KDF invocations (T-6, E-7).
    App\Modules\UserManagement\Domain\VerifiesPasswords: '@App\Modules\UserManagement\Infrastructure\PasswordVerifier'

    # E4-3 / A-2 — the first `Application\Contract` binding in this tree.
    # `Inventory`'s item writer takes the interface, never the implementation:
    # the deptrac ruleset lets `InventoryApplication` reach
    # `UserManagementContract` and nothing else of this module, so the binding
    # is what makes the sanctioned edge the only one that exists. Explicit for
    # the same reason as the two above -- an interface with one implementation
    # resolves silently, and the day a second appears the choice should be an
    # edit somebody makes on purpose.
    App\Modules\UserManagement\Application\Contract\WorkspaceSettings: '@App\Modules\UserManagement\Infrastructure\TenantSettingsReader'

    # ARCHITECTURE §5.5 W-1/W-3 — `Purchasing → Inventory::ReceiveStock`, the
    # goods-receipt half of the two cross-module write edges. Explicit for the
    # reason the binding above gives. It has no consumer until step 8, so it is
    # private and unused today; the test env reaches it through a public alias
    # of THIS id (below), so what is tested is this binding and not a copy.
    App\Modules\Inventory\Application\Contract\ReceiveStock: '@App\Modules\Inventory\Application\StockReceiver'

    # ARCHITECTURE §5.5 W-1/W-3 — `Sales → Inventory::DepleteStock`, the
    # fulfilment half of the two cross-module write edges (sales step 5, commit 1).
    # Explicit for the same reason. Its one consumer is `FulfilmentWriter` (sales step 5,
    # commit 4); the test env still reaches it directly through a public alias of THIS id.
    App\Modules\Inventory\Application\Contract\DepleteStock: '@App\Modules\Inventory\Application\StockDepleter'

    # ARCHITECTURE §5.5 W-1/W-3 — `Sales → Inventory::ReturnStock`, the THIRD cross-module write edge (`ARCH`'s W-3
    # amendment of 2026-09-30, owner ruling Q-J; sales step 7 R2). Explicit for the same reason. Its one consumer is
    # `SalesReturnWriter` (`CreateSalesReturn`); the test env reaches it through a public alias of THIS id.
    App\Modules\Inventory\Application\Contract\ReturnStock: '@App\Modules\Inventory\Application\StockReturner'

    # The stock count (stock count C1, 2026-10-16): NOT a cross-module edge — its one consumer is Inventory's own
    # `CreateStockAdjustmentProcessor` — but E-26 binds the `adjustment` reason to one writer behind one contract
    # (`SEC` stock-adjustment-sec.md §7, mechanism (a)), so it is wired explicitly like its three siblings.
    App\Modules\Inventory\Application\Contract\AdjustStock: '@App\Modules\Inventory\Application\StockAdjuster'

    # The stock transfer (stock transfer C1, 2026-10-20): NOT a cross-module edge either — its one consumer is Inventory's
    # own `CreateStockTransferProcessor` — but E-26 binds `transfer_out` / `transfer_in` to one writer behind one contract
    # (`SEC` stock-transfer-sec.md §1.4), so it is wired explicitly like the count.
    App\Modules\Inventory\Application\Contract\TransferStock: '@App\Modules\Inventory\Application\StockTransferrer'

    # The pick read's candidate bins (sales step 5, commit 3): a read contract, so the rule for what is
    # pickable (owner ruling R2) is written once, in Inventory, beside the depletion that enforces it.
    App\Modules\Inventory\Application\Contract\PickableStock: '@App\Modules\Inventory\Application\PickableStockReader'

    # C5 C2b — `DeleteSupplier` asks Purchasing whether a supplier has open purchase orders (owner ruling Q-S2). An inbound
    # PORT of Suppliers implemented by its one named consumer (`docs/session13/c5-design.md` R1.6; co-signed by `ARCH` 2026-10-14),
    # never a Contract: `Ai`/`Analytics` may not use `SuppliersPort` (deptrac). Explicit for the reason the bindings above give.
    App\Modules\Suppliers\Application\Port\SupplierOpenWork: '@App\Modules\Purchasing\Application\SupplierOpenPurchaseOrders'

    # C5 C4b — `DeleteCustomer` asks Sales what a customer still has open (ruling Q-1 (b′): open orders, uninvoiced shipments,
    # unpaid invoices, credits owed). `SupplierOpenWork`'s shape: an inbound PORT of Customers implemented by its one named
    # consumer (`c5-design.md` R1.6; co-signed by `ARCH` 2026-10-14), never a Contract — `Ai`/`Analytics` may not use `CustomersPort`.
    App\Modules\Customers\Application\Port\CustomerOpenWork: '@App\Modules\Sales\Application\CustomerOpenSalesWork'

    # Warehouse/location delete-restore C3 — `DeleteStorageLocation` asks Inventory whether a location holds stock (owner
    # Q-1: refuse). The split-port shape (`docs/session13/wh-loc-delete-arch.md` §1): an inbound PORT of Warehouses in its own
    # `WarehousesInventoryPort` layer, implemented by its one named consumer, never a Contract — `Ai`/`Analytics` may not use it.
    App\Modules\Warehouses\Application\Port\Inventory\WarehouseHeldStock: '@App\Modules\Inventory\Application\InventoryHeldStock'

    # Warehouse/location delete-restore C4 — `DeleteWarehouse` asks Purchasing and Sales whether a warehouse has open orders
    # (API-O-34). The split-port shape: one layer per answering module (`WarehousesPurchasingPort`, `WarehousesSalesPort`).
    App\Modules\Warehouses\Application\Port\Purchasing\WarehouseOpenPurchaseOrders: '@App\Modules\Purchasing\Application\WarehouseOpenPurchaseOrdersCount'
    App\Modules\Warehouses\Application\Port\Sales\WarehouseOpenSalesOrders: '@App\Modules\Sales\Application\WarehouseOpenSalesOrdersCount'

when@test:
    services:
        # T-1 / API-7: nothing in the request may carry a tenant, and the test
        # env no longer overrides the seam at all -- `CurrentTenant` is the
        # production `AuthenticatedTenant` here too. `ApiTestCase::actAs()` mints
        # a real token and sets the identity on this service, and an HTTP request
        # overwrites it from the token's own claim. The `FixedTenant` this
        # replaced was a second source of tenant that no request could contradict,
        # so a resource reading the wrong claim would still have been green.
        App\Platform\Security\RequestIdentity:
            autowire: true
            public: true

        App\Platform\Tenancy\TenantContext:
            autowire: true
            public: true
        test.doctrine.dbal.ai_connection:
            alias: doctrine.dbal.ai_connection
            public: true

        # Four of this contract's rules are properties of the SQL rather than of
        # the response body. This records it at the driver layer.
        # B-3's phase-2 check regenerates the spec; the factory is private.
        test.api_platform.openapi.factory:
            alias: api_platform.openapi.factory
            public: true

        # `ReceiveStock` has no consumer until step 8, and an unused private
        # service is removed at compile time. Aliasing the interface id (not the
        # implementation) keeps the production binding the thing under test.
        test.inventory.receive_stock:
            alias: App\Modules\Inventory\Application\Contract\ReceiveStock
            public: true

        # The same, for `DepleteStock` -- `DepleteStockTest` drives the contract directly.
        test.inventory.deplete_stock:
            alias: App\Modules\Inventory\Application\Contract\DepleteStock
            public: true

        # The same, for `ReturnStock` (sales step 7 R2).
        test.inventory.return_stock:
            alias: App\Modules\Inventory\Application\Contract\ReturnStock
            public: true

        App\Tests\Support\SqlRecorder:
            public: true

        # A-10's measurement: a `Connection` with no binding, autowired. What it
        # resolves to is asserted by `ConnectionBindingTest`, not stated here.
        App\Tests\Support\UnboundConnectionProbe:
            autowire: true
            public: true

        App\Tests\Support\RecordingMiddleware:
            arguments: ['@App\Tests\Support\SqlRecorder']
            tags: ['doctrine.middleware']

        # `API.md` §7.2's *fails if* is per **connection** — "any statement on
        # the token-issuing path before step 9 is issued on the `erp_app`
        # connection" — and the recorder above is wired to every connection at
        # once, so it can say what ran and not where. One recorder per named
        # connection is what makes the assertion the document asks for possible;
        # the `connection` tag attribute is DoctrineBundle's own scoping.
        test.sql_recorder.app: {class: App\Tests\Support\SqlRecorder, public: true}
        test.sql_recorder.auth: {class: App\Tests\Support\SqlRecorder, public: true}
        test.sql_recorder.authlog: {class: App\Tests\Support\SqlRecorder, public: true}
        test.sql_recorder.ratelimit: {class: App\Tests\Support\SqlRecorder, public: true}
        # V3-1(i) item (5), V4 batch B2b-3: the schema owner's statements, recorded
        # only while a main request is served (App\Tests\Support\OwnerRequestWindow).
        # ApiTestCase::tearDown fails any HTTP test in which one was issued.
        test.sql_recorder.owner: {class: App\Tests\Support\SqlRecorder, public: true}

        test.recording_middleware.app:
            class: App\Tests\Support\RecordingMiddleware
            arguments: ['@test.sql_recorder.app']
            tags: [{name: 'doctrine.middleware', connection: 'app'}]
        test.recording_middleware.auth:
            class: App\Tests\Support\RecordingMiddleware
            arguments: ['@test.sql_recorder.auth']
            tags: [{name: 'doctrine.middleware', connection: 'auth'}]
        test.recording_middleware.authlog:
            class: App\Tests\Support\RecordingMiddleware
            arguments: ['@test.sql_recorder.authlog']
            tags: [{name: 'doctrine.middleware', connection: 'authlog'}]
        test.recording_middleware.ratelimit:
            class: App\Tests\Support\RecordingMiddleware
            arguments: ['@test.sql_recorder.ratelimit']
            tags: [{name: 'doctrine.middleware', connection: 'ratelimit'}]
        test.recording_middleware.owner:
            class: App\Tests\Support\RecordingMiddleware
            arguments: ['@test.sql_recorder.owner']
            tags: [{name: 'doctrine.middleware', connection: 'owner'}]
        App\Tests\Support\OwnerRequestWindow:
            arguments: ['@test.sql_recorder.owner']
            tags: ['kernel.event_subscriber']
            public: true

        # T-6 / E-7 — the KDF invocation count, which no response and no SQL log
        # carries. It decorates the **KDF**, not `VerifiesPasswords`: the old
        # `CountingPasswordVerifier` wrapped the verifier from outside and so
        # counted wrapper calls rather than KDF executions, reading 1 while
        # `NativePasswordHasher::verify()` short-circuited an empty password to
        # false at zero rounds (fake-green eighteen). Production never sees this
        # class.
        App\Tests\Support\CountingKdf:
            decorates: app.auth.kdf
            arguments: ['@.inner']
            public: true

        # Aliases rather than redefinitions: a `public: true` on the real
        # definition would restate its arguments here, and a second copy of a
        # connection binding or an env-var name is the drift these tests exist to
        # catch. The service under test is the one production wires.
        test.auth.email_hasher: {alias: 'App\Modules\UserManagement\Infrastructure\EmailHasher', public: true}
        test.auth.token_issuer: {alias: 'App\Modules\UserManagement\Infrastructure\AccessTokenIssuer', public: true}
        test.auth.token_verifier: {alias: 'App\Platform\Security\AccessTokenVerifier', public: true}
        test.auth.password_verifier: {alias: 'App\Modules\UserManagement\Infrastructure\PasswordVerifier', public: true}
        test.auth.budgets: {alias: 'App\Modules\UserManagement\Infrastructure\PreAuthBudgets', public: true}
        test.doctrine.dbal.ratelimit_connection: {alias: 'doctrine.dbal.ratelimit_connection', public: true}

    parameters:
        # A second Argon2id dummy at m=1024 KiB, t=3, p=1. The production
        # parameters are deliberate slowness and this suite drives the KDF
        # several hundred times in one run (E-21's ceilings are 100 and 300), so
        # at m=65536 the budget tests alone would take minutes. Measured here:
        # 2.19 ms per verify, against 1.55 ms for the bcrypt cost 4 this
        # replaced. t=3 and m>=10 KiB are `NativePasswordHasher`'s own floors —
        # it throws below either — so this is close to the cheapest dummy the
        # component will build.
        #
        # Nothing about the branch structure depends on the numbers —
        # `PasswordVerifierTest` asserts the KDF's parameters are read off
        # whichever value is configured, which is what stops the two drifting.
        # The gap the short-circuit check needs survives the reduction: 2.19 ms
        # of KDF against 0.000 ms of short-circuit is still four orders of
        # magnitude.
        app.auth.dummy_password_hash: '$argon2id$v=19$m=1024,t=3,p=1$VHI3bmJZZUIudFF3MDB4Sg$eewE/E8Yvk7d/WPEVdqbJVmrVw4AyOKiQ0W4FudFr4o'
