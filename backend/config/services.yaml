# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # API-2 / P-1. Declared once, here, because two things need it and neither
    # may carry its own copy: the route prefix in config/routes/api_platform.yaml
    # and the scope of the problem+json translator. `ApiRoutingTest` asserts the
    # router agrees with this value rather than trusting that it was kept in step.
    app.api_base_path: '/api/v1'

    # inventory_item.currency_code is NOT NULL with its default dropped
    # (Version20260906000100), and §4.2's `CreateItem` row -- which is exhaustive
    # -- does not accept a currency. See the finding in the Output 4 phase-2
    # report: this is a stand-in with a name, not a design.
    app.inventory.default_currency_code: 'EUR'

    # `API.md` §7.1 step 5 — the fixed dummy the KDF runs against on either miss
    # path, and the ONE place the cost factor is configured: `PasswordVerifier`
    # reads the cost out of this string rather than taking a second parameter,
    # because "a dummy of the same cost factor" is a requirement about two values
    # and two configured numbers drift.
    #
    # A bcrypt hash of 32 random bytes nobody recorded. Not a secret — it matches
    # no password by construction — so it is here rather than in the environment;
    # hiding a non-secret makes the real ones harder to find (Standing Rule 10).
    app.auth.dummy_password_hash: '$2y$12$SSmgiu/BdRDlOZ4lkWAsQOB93QPvGgKO1tRnozrdG1nP2U580SP0e'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        # Data, not services. An `#[ErrorResource]` exception and a set of
        # request/response DTOs are constructed by the serializer and by named
        # factories; registering them as services would have the container try to
        # autowire constructors that take a SKU.
        # Data, not services. These are constructed by the serializer or by
        # named factories, and registering them would have the container try to
        # autowire a constructor that takes a SKU.
        #
        # `ItemResource`, `ItemCollection` and `ApiProblem` are deliberately NOT
        # excluded: API Platform discovers resources through the container's
        # attribute autoconfiguration, so a resource class the container never
        # sees has no routes at all. It marks them abstract, so nothing tries to
        # instantiate them.
        exclude:
            - '../src/Api/Pagination/'
            - '../src/Api/Problem/ProblemType.php'
            - '../src/Inventory/ApiResource/{CreateItemInput.php,UpdateItemInput.php,SupplierReference.php}'
            - '../src/Inventory/Application/{ItemRow.php,ItemListCriteria.php}'
            # Data, not services, on the Output 4 §7 side: request/response DTOs
            # and read models the serializer or a named factory builds, plus one
            # function-only class with a private constructor the container would
            # otherwise try to instantiate.
            #
            # `TokenResource` and `CurrentUserResource` are deliberately NOT
            # excluded, for the reason `ItemResource` is not: API Platform
            # discovers resources through the container's attribute
            # autoconfiguration, so a resource class the container never sees has
            # no routes at all.
            - '../src/Auth/Domain/PreAuthKeys.php'
            - '../src/Auth/ApiResource/{IssueTokenInput.php,RoleReference.php}'
            - '../src/Auth/Application/{SignInCommand.php,SignInResult.php}'
            - '../src/Auth/Infrastructure/{CredentialRow.php,IssuedToken.php}'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Fails closed until the JWT claim reader of §7 exists. Deliberately an
    # explicit binding rather than an autowired default: an interface with one
    # implementation resolves silently, and the day a second one appears the
    # choice should be an edit somebody makes on purpose.
    App\Api\Tenancy\CurrentTenant: '@App\Api\Tenancy\UnauthenticatedTenant'

    # ------------------------------------------------------------------
    # Output 4 §7 — the token sign-in path.
    #
    # Every one of these is an EXPLICIT connection binding, and that is the
    # security control rather than a configuration style. `API.md` §7.1 names one
    # principal per step; the ORM's entity manager is pinned to `app`, so an
    # autowired `Connection` would silently be `erp_app` — the one connection
    # §7.2's *fails if* forbids on this path. Wired wrongly it does not degrade:
    # `erp_app` holds nothing at all on the three counter tables, so the first
    # statement raises `permission denied`
    # (`GrantFootprintTest::aRateLimiterWiredToTheWrongConnectionFailsImmediately`).
    # ------------------------------------------------------------------
    App\Auth\Infrastructure\PreAuthBudgets:
        arguments:
            $rateLimit: '@doctrine.dbal.ratelimit_connection'

    App\Auth\Infrastructure\LockoutStore:
        arguments:
            $rateLimit: '@doctrine.dbal.ratelimit_connection'

    App\Auth\Infrastructure\CredentialLookup:
        arguments:
            $auth: '@doctrine.dbal.auth_connection'

    App\Auth\Infrastructure\AuthTrailWriter:
        arguments:
            $authLog: '@doctrine.dbal.authlog_connection'

    # The one collaborator that IS on `erp_app`, and only because `/me` runs
    # after authentication. §7.1 step 9 and this reader are the whole of it.
    App\Auth\Application\CurrentUserReader:
        arguments:
            $app: '@doctrine.dbal.app_connection'

    App\Auth\Infrastructure\EmailHasher:
        arguments:
            $key: '%env(AUTH_EMAIL_HASH_KEY)%'

    App\Auth\Infrastructure\AccessTokens:
        arguments:
            $signingKey: '%env(AUTH_TOKEN_SIGNING_KEY)%'

    App\Auth\Infrastructure\PasswordVerifier:
        arguments:
            $dummyHash: '%app.auth.dummy_password_hash%'

    # Explicit, like the `CurrentTenant` binding above and for the same reason:
    # an interface with one implementation resolves silently, and this one exists
    # so a test decorator can count KDF invocations (T-6, E-7).
    App\Auth\Domain\VerifiesPasswords: '@App\Auth\Infrastructure\PasswordVerifier'

when@test:
    services:
        # T-1 / API-7: nothing in the request may carry a tenant. The test rig
        # therefore sets the tenant on the container, which is the same place
        # the JWT claim reader will set it once §7 is built.
        App\Api\Tenancy\CurrentTenant:
            class: App\Api\Tenancy\FixedTenant
            public: true

        App\Tenancy\TenantContext:
            autowire: true
            public: true
        test.doctrine.dbal.ai_connection:
            alias: doctrine.dbal.ai_connection
            public: true

        # Four of this contract's rules are properties of the SQL rather than of
        # the response body. This records it at the driver layer.
        # B-3's phase-2 check regenerates the spec; the factory is private.
        test.api_platform.openapi.factory:
            alias: api_platform.openapi.factory
            public: true

        App\Tests\Support\SqlRecorder:
            public: true

        App\Tests\Support\RecordingMiddleware:
            arguments: ['@App\Tests\Support\SqlRecorder']
            tags: ['doctrine.middleware']

        # `API.md` §7.2's *fails if* is per **connection** — "any statement on
        # the token-issuing path before step 9 is issued on the `erp_app`
        # connection" — and the recorder above is wired to every connection at
        # once, so it can say what ran and not where. One recorder per named
        # connection is what makes the assertion the document asks for possible;
        # the `connection` tag attribute is DoctrineBundle's own scoping.
        test.sql_recorder.app: {class: App\Tests\Support\SqlRecorder, public: true}
        test.sql_recorder.auth: {class: App\Tests\Support\SqlRecorder, public: true}
        test.sql_recorder.authlog: {class: App\Tests\Support\SqlRecorder, public: true}
        test.sql_recorder.ratelimit: {class: App\Tests\Support\SqlRecorder, public: true}

        test.recording_middleware.app:
            class: App\Tests\Support\RecordingMiddleware
            arguments: ['@test.sql_recorder.app']
            tags: [{name: 'doctrine.middleware', connection: 'app'}]
        test.recording_middleware.auth:
            class: App\Tests\Support\RecordingMiddleware
            arguments: ['@test.sql_recorder.auth']
            tags: [{name: 'doctrine.middleware', connection: 'auth'}]
        test.recording_middleware.authlog:
            class: App\Tests\Support\RecordingMiddleware
            arguments: ['@test.sql_recorder.authlog']
            tags: [{name: 'doctrine.middleware', connection: 'authlog'}]
        test.recording_middleware.ratelimit:
            class: App\Tests\Support\RecordingMiddleware
            arguments: ['@test.sql_recorder.ratelimit']
            tags: [{name: 'doctrine.middleware', connection: 'ratelimit'}]

        # T-6 / E-7 — the KDF invocation count, which no response and no SQL log
        # carries. Decorates the real verifier; production never sees this class.
        App\Tests\Support\CountingPasswordVerifier:
            decorates: App\Auth\Domain\VerifiesPasswords
            arguments: ['@.inner']
            public: true

        # Aliases rather than redefinitions: a `public: true` on the real
        # definition would restate its arguments here, and a second copy of a
        # connection binding or an env-var name is the drift these tests exist to
        # catch. The service under test is the one production wires.
        test.auth.email_hasher: {alias: 'App\Auth\Infrastructure\EmailHasher', public: true}
        test.auth.access_tokens: {alias: 'App\Auth\Infrastructure\AccessTokens', public: true}
        test.auth.password_verifier: {alias: 'App\Auth\Infrastructure\PasswordVerifier', public: true}
        test.auth.budgets: {alias: 'App\Auth\Infrastructure\PreAuthBudgets', public: true}
        test.doctrine.dbal.ratelimit_connection: {alias: 'doctrine.dbal.ratelimit_connection', public: true}

    parameters:
        # The same dummy at bcrypt cost 4. The production cost is deliberate
        # slowness and this suite drives the KDF several hundred times in one
        # run (E-21's ceilings are 100 and 300), so at cost 12 the budget tests
        # alone would take minutes. Nothing about the branch structure depends on
        # the number — `PasswordVerifierTest` asserts the hasher's cost is read
        # off whichever value is configured, which is what stops the two drifting.
        app.auth.dummy_password_hash: '$2y$04$kce4oF.FRXilQx4aZL.rOevBh72CH1EfFWRG4auT/dh.TdE.oGwZa'
