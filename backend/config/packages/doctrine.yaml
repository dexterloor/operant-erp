# ADR-002 §1 as amended by A1.3 / ADR-006 — six principals, six DSNs. Which role a connection uses is a
# security control, not a convenience:
#
#   owner      direct + unpooled, owns the schema, runs migrations, never serves requests
#   app        through PgBouncer as erp_app  — the application and the isolation suite
#   ai         through PgBouncer as erp_ai   — SELECT only, for the NL query agent
#   auth       erp_auth      — pre-auth slug + credential read, no write anywhere
#   authlog    erp_authlog   — INSERT on audit_log only, cannot read it back
#   ratelimit  erp_ratelimit — the pre-auth counter tables and nothing else
#
# `owner` is the DBAL default purely so that doctrine:migrations picks it up without
# a flag. The ORM entity manager is pinned to `app`, so no application code can
# reach the database as the owner by accident.
# Doctrine's debug middleware (on whenever %kernel.debug% is) keeps every statement a connection runs, and with this
# flag a backtrace of each. Nothing in this project reads them in any environment -- there is no profiler bundle and no
# `framework.profiler` -- and under test they were the bulk of the suite's memory: `ResponseShapeTest::
# everyReferenceIsExpanded` probes every tenant table for every expanded id over the owner connection, ~36,000
# statements in one kernel, and their backtraces held 313 MB of the test's 473 MB peak (2026-10-20; a full gate died at
# memory_limit 512M on it). Off under test, as a parameter rather than a `when@test` connection block, because
# `EnvProcessorPinTest` pins each connection's keys in every `when@*` block. Pinned off by `DebugBacktraceOffInTestTest`.
parameters:
    app.doctrine.collect_backtrace: '%kernel.debug%'

when@test:
    parameters:
        app.doctrine.collect_backtrace: false

doctrine:
    dbal:
        types:
            # Postgres writes microseconds; DBAL's built-in parser does not read
            # them. Overridden globally rather than per column.
            datetimetz_immutable: App\Platform\Persistence\Type\TimestampTzImmutableType
            # Writes the fraction of the second too, for a column a CHECK compares with a database-written instant
            # (invoice.paid_at vs issued_at, sales step 6 C5). Opt-in per column; see the class.
            datetimetz_microseconds_immutable: App\Platform\Persistence\Type\TimestampTzMicrosecondsImmutableType
            # audit_log.ip_address. Registered rather than declared as a string,
            # so that the ORM emits INET and the schema comparison stays silent.
            inet: App\Platform\Persistence\Type\InetType
        default_connection: owner
        connections:
            owner:
                url: '%env(resolve:DATABASE_URL)%'
                profiling_collect_backtrace: '%app.doctrine.collect_backtrace%'
                # Postgres network types have no DBAL equivalent, and without a
                # mapping any introspection of the whole schema aborts with
                # "Unknown database type cidr" -- which takes the ORM/DB
                # divergence pin with it, since that pin introspects everything.
                # Mapped to string for reverse engineering only; the columns stay
                # cidr and inet in the database, where Postgres validates them.
                mapping_types:
                    cidr: string
                    inet: inet
            app:
                url: '%env(resolve:APP_DATABASE_URL)%'
                profiling_collect_backtrace: '%app.doctrine.collect_backtrace%'
                # Postgres network types have no DBAL equivalent, and without a
                # mapping any introspection of the whole schema aborts with
                # "Unknown database type cidr" -- which takes the ORM/DB
                # divergence pin with it, since that pin introspects everything.
                # Mapped to string for reverse engineering only; the columns stay
                # cidr and inet in the database, where Postgres validates them.
                mapping_types:
                    cidr: string
                    inet: inet
            ai:
                url: '%env(resolve:AI_DATABASE_URL)%'
                profiling_collect_backtrace: '%app.doctrine.collect_backtrace%'
                # Postgres network types have no DBAL equivalent, and without a
                # mapping any introspection of the whole schema aborts with
                # "Unknown database type cidr" -- which takes the ORM/DB
                # divergence pin with it, since that pin introspects everything.
                # Mapped to string for reverse engineering only; the columns stay
                # cidr and inet in the database, where Postgres validates them.
                mapping_types:
                    cidr: string
                    inet: inet
            # ADR-006 §2 — the pre-authentication principals. Separate
            # credentials on separate connections is the property: no SQL the
            # application emits can undo the separation, where a missing
            # `SET LOCAL ROLE` on one shared connection would restore full
            # privilege silently.
            auth:
                url: '%env(resolve:AUTH_DATABASE_URL)%'
                profiling_collect_backtrace: '%app.doctrine.collect_backtrace%'
                # Postgres network types have no DBAL equivalent, and without a
                # mapping any introspection of the whole schema aborts with
                # "Unknown database type cidr" -- which takes the ORM/DB
                # divergence pin with it, since that pin introspects everything.
                # Mapped to string for reverse engineering only; the columns stay
                # cidr and inet in the database, where Postgres validates them.
                mapping_types:
                    cidr: string
                    inet: inet
            authlog:
                url: '%env(resolve:AUTHLOG_DATABASE_URL)%'
                profiling_collect_backtrace: '%app.doctrine.collect_backtrace%'
                # Postgres network types have no DBAL equivalent, and without a
                # mapping any introspection of the whole schema aborts with
                # "Unknown database type cidr" -- which takes the ORM/DB
                # divergence pin with it, since that pin introspects everything.
                # Mapped to string for reverse engineering only; the columns stay
                # cidr and inet in the database, where Postgres validates them.
                mapping_types:
                    cidr: string
                    inet: inet
            ratelimit:
                url: '%env(resolve:RATELIMIT_DATABASE_URL)%'
                profiling_collect_backtrace: '%app.doctrine.collect_backtrace%'
                # Postgres network types have no DBAL equivalent, and without a
                # mapping any introspection of the whole schema aborts with
                # "Unknown database type cidr" -- which takes the ORM/DB
                # divergence pin with it, since that pin introspects everything.
                # Mapped to string for reverse engineering only; the columns stay
                # cidr and inet in the database, where Postgres validates them.
                mapping_types:
                    cidr: string
                    inet: inet
    orm:
        default_entity_manager: default
        entity_managers:
            default:
                connection: app
                validate_xml_mapping: true
                naming_strategy: doctrine.orm.naming_strategy.underscore
                identity_generation_preferences:
                    Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
                auto_mapping: true
                # Output 5 — one mapping per module, and that is the point rather
                # than a style. `SchemaManifest::TABLES[*]['module']` names the
                # module that owns each table; before this output that value was a
                # declaration nothing could contradict (`SCHEMA.md` §14 recorded it
                # as such). Splitting the mapping makes it structural: an entity is
                # only mapped at all if it sits under the directory of the module
                # whose `prefix` matches its namespace, and
                # `SchemaOwnershipTest::everyMappedEntityLivesInTheModuleTheManifestDeclaresForItsTable`
                # then asserts the two agree for every mapped entity. Moving one
                # entity to the wrong module fails that test; deleting a mapping
                # block here fails `SchemaManifestTest` because the table's ORM
                # side disappears from the divergence pin.
                mappings:
                    PlatformTenancy:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Platform/Tenancy/Entity'
                        prefix: 'App\Platform\Tenancy\Entity'
                    SharedKernelReference:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/SharedKernel/Reference'
                        prefix: 'App\SharedKernel\Reference'
                    ModulesAuditLog:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Modules/AuditLog/Infrastructure/Entity'
                        prefix: 'App\Modules\AuditLog\Infrastructure\Entity'
                    ModulesCustomers:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Modules/Customers/Infrastructure/Entity'
                        prefix: 'App\Modules\Customers\Infrastructure\Entity'
                    ModulesInventory:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Modules/Inventory/Infrastructure/Entity'
                        prefix: 'App\Modules\Inventory\Infrastructure\Entity'
                    ModulesPurchasing:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Modules/Purchasing/Infrastructure/Entity'
                        prefix: 'App\Modules\Purchasing\Infrastructure\Entity'
                    ModulesSales:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Modules/Sales/Infrastructure/Entity'
                        prefix: 'App\Modules\Sales\Infrastructure\Entity'
                    ModulesSuppliers:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Modules/Suppliers/Infrastructure/Entity'
                        prefix: 'App\Modules\Suppliers\Infrastructure\Entity'
                    ModulesUserManagement:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Modules/UserManagement/Infrastructure/Entity'
                        prefix: 'App\Modules\UserManagement\Infrastructure\Entity'
                    ModulesWarehouses:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Modules/Warehouses/Infrastructure/Entity'
                        prefix: 'App\Modules\Warehouses\Infrastructure\Entity'
                filters:
                    tenant:
                        class: App\Platform\Tenancy\TenantFilter
                        enabled: true
                    # ADR-007 §2. Deliberately configured next to the tenant
                    # filter and deliberately not described as its equal:
                    # forgetting this one shows a user a row they deleted,
                    # forgetting the other shows them nothing they should not
                    # see, because RLS is underneath it.
                    soft_delete:
                        class: App\Platform\Tenancy\SoftDeleteFilter
                        enabled: true
                # ADR-002 "Open items": DDC-3174 reported the query cache not keying
                # on SQLFilter state. Not confirmed for ORM 3.x, so both caches stay
                # off. See tests/Tenancy/QueryCacheFilterStateTest.php for what we
                # were and were not able to reproduce.
                query_cache_driver:
                    type: pool
                    pool: doctrine.query_cache_pool
                result_cache_driver:
                    type: pool
                    pool: doctrine.result_cache_pool
                second_level_cache:
                    enabled: false
